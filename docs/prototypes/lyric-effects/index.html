<!doctype html>

<style>
  :root { --bg: #0d0e13; --card: #161821; --line: #262a3a; --fg: #eef0f6; --dim: #8a8fa3; --accent: #8ab4ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; }
  header, section { max-width: 1320px; margin: auto; padding: 0 28px; }
  header { padding-top: 28px; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .sub { color: var(--dim); margin: 0; }
  .summary { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
  .pill { padding: 3px 11px; border-radius: 999px; background: #ffffff0d; border: 1px solid var(--line); font-size: 12.5px; color: #c9cdda; }
  .pill b { color: var(--fg); }
  h2 { font-size: 17px; margin: 30px 0 4px; }
  h2 small { color: var(--dim); font-weight: 400; margin-left: 8px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; margin-top: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; transition: border-color .2s, transform .2s; }
  .card:hover { border-color: #3d4363; }
  .card.playing { border-color: var(--accent); }
  .card.wide { grid-column: span 2; }
  @media (max-width: 820px) { .card.wide { grid-column: auto; } }
  .stage { position: relative; height: 160px; overflow: hidden; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 140% at 15% 0%, #2a2f4d 0%, #14151e 70%); }
  .stage.tall { height: 230px; }
  .stage .hint { position: absolute; right: 10px; bottom: 7px; font-size: 11.5px; color: #ffffff70; pointer-events: none; }
  .stage .bgfx { position: absolute; inset: 0; pointer-events: none; }
  .meta { padding: 11px 14px 12px; }
  .meta h3 { margin: 0; font-size: 15px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; font-weight: 400; }
  .tag.t-auto { background: #3fcf9e22; color: #6ee7b7; }
  .tag.t-ai { background: #a77bff26; color: #c4a8ff; }
  .tag.t-stage { background: #ffb34722; color: #ffcc80; }
  .tag.t-where { background: #ffffff10; color: var(--dim); }
  .tag.t-new { background: #ff6f9126; color: #ff9fb8; }
  .card.cand { border-color: #ff6f9140; }
  .meta p { margin: 6px 0 0; color: #b7bccb; font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 13px; }
  .chip { font-size: 12px; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); background: #ffffff08; color: #d6d9e4; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  /* 歌词 */
  .lyric { position: relative; font-size: 30px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
  .lyric.small { font-size: 18px; }
  .ch { display: inline-block; position: relative; color: transparent; -webkit-background-clip: text; background-clip: text;
    background-image: linear-gradient(90deg, var(--hi, #fff) var(--p, -18%), rgba(255, 255, 255, .32) calc(var(--p, -18%) + 18%));
    will-change: transform, filter; }
  .ch.sp { width: .35em; }
  .ch::after { content: ''; position: absolute; left: 0; right: 0; height: .07em; border-radius: .04em; background: var(--hi, #fff);
    transform-origin: left center; transform: scaleX(var(--line, 0)); opacity: 0; }
  .ch.u::after { bottom: .06em; opacity: 1; }
  .ch.s::after { top: 52%; opacity: 1; }
  .roman { display: block; text-align: center; font-size: 12px; font-weight: 500; margin-top: 2px; letter-spacing: 0; }
  .note { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 13px; color: #ffffffd0; opacity: 0; transition: opacity .8s; padding: 0 30px; }
  .note small { display: block; font-size: 11px; color: #ffffff80; }
</style>
</head>
<body>
<header>
  <h1>歌词动效一览</h1>
  <p class="sub">当前已实现的全部歌词动效（按代码清点：lyric-player / emphasis / vibrato / stage-effects / stage-particles / interlude / moments / nav-emphasis）。点击卡片播放演示，带标签的卡片可以切换参数。</p>
  <div class="summary" id="summary"></div>
  <p class="sub" style="font-size:12.5px;margin-top:6px">
    <span class="tag t-auto">自动</span> 所有逐字歌词都有
    <span class="tag t-ai">AI 标注</span> 来自后台大模型对歌词的标注
    <span class="tag t-stage">舞台</span> 只在播放器页（/music）全屏演出
    原型用简化的实现模拟真实效果（曲线、时长与幅度取自代码），用于看效果、讨论新增方向。
  </p>
</header>
<main id="main"></main>

<script>
// ================= 曲线（与 easing.ts 相同） =================
function cubicBezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by
  const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t, dx = t => (3 * ax * t + 2 * bx) * t + cx
  return (x) => {
    if (x <= 0) return 0
    if (x >= 1) return 1
    let t = x
    for (let i = 0; i < 8; i++) { const e = sx(t) - x; if (Math.abs(e) < 1e-5) break; const d = dx(t); if (Math.abs(d) < 1e-6) break; t -= e / d }
    return sy(t)
  }
}
const swellIn = cubicBezier(0.2, 0.4, 0.58, 1), swellOut = cubicBezier(0.3, 0, 0.58, 1)
const swell = x => (x <= 0 || x >= 1) ? 0 : x < 0.5 ? swellIn(x / 0.5) : 1 - swellOut((x - 0.5) / 0.5)
const clamp01 = x => Math.min(1, Math.max(0, x))

// ================= 色板 / 字体 / 情绪（与 colors.ts、lyric-player.css、lyric-player.ts 一致） =================
const COLORS = { crimson: ['#ff5c6c', '绯红'], rose: ['#ff6f91', '玫瑰'], flame: ['#ff6a3d', '火焰'], sunset: ['#ff8a65', '夕阳'], coral: ['#ff9f80', '珊瑚'], maple: ['#ff7f3f', '枫叶'], amber: ['#ffb347', '琥珀'], peach: ['#ffa8a0', '蜜桃'], 'cherry-blossom': ['#ffb3c8', '樱花'], bauhinia: ['#e86fb0', '紫荆'], sunshine: ['#ffd54f', '阳光'], gold: ['#f5c542', '金色'], lemon: ['#fff176', '柠檬'], candlelight: ['#ffe0a3', '烛光'], 'spring-green': ['#a5e887', '春绿'], forest: ['#5fd38d', '森林'], mint: ['#8ef0c8', '薄荷'], jade: ['#3fcf9e', '翡翠'], aurora: ['#6effd0', '极光'], lake: ['#4fd1d9', '湖水'], sky: ['#74c0fc', '天空'], ocean: ['#3d9df5', '海洋'], 'starry-blue': ['#6c8cff', '星蓝'], midnight: ['#7b83eb', '午夜'], ice: ['#b5e8ff', '冰'], rain: ['#9bb7d4', '雨'], lavender: ['#c3a6ff', '薰衣草'], violet: ['#a77bff', '紫罗兰'], twilight: ['#b388eb', '暮光'], wisteria: ['#d4a5f5', '紫藤'], moonlight: ['#f0f4ff', '月光'], silver: ['#d7dde8', '银'] }
const FONTS = { song: ['宋体', '"Songti SC","Noto Serif SC",serif'], kai: ['楷体', '"Kaiti SC","LXGW WenKai",cursive'], xingkai: ['行楷', '"Xingkai SC","Zhi Mang Xing",cursive'], fangsong: ['仿宋', '"STFangsong","FangSong",serif'], round: ['圆体', '"Yuanti SC","ZCOOL KuaiLe",sans-serif'], mono: ['等宽', '"SF Mono",Menlo,monospace'], script: ['手写（英文）', '"Snell Roundhand","Dancing Script",cursive'] }
const MOODS = { calm: ['平静', '#cfe8ff'], bright: ['明亮', '#ffe6a8'], sad: ['伤感', '#d6ceff'], intense: ['激昂', '#ffc0b3'] }

// ================= 歌词行：逐字时间、擦除、上浮、强调（移植自 lyric-player.ts paintEmphasis） =================
function buildLine(parent, text, { ms = 380, holds = {}, cls = '', start = 0 } = {}) {
  const el = document.createElement('div')
  el.className = 'lyric ' + cls
  const chars = []
  let t = start
  ;[...text].forEach((c, i) => {
    const span = document.createElement('span')
    span.className = 'ch' + (c === ' ' ? ' sp' : '')
    span.textContent = c === ' ' ? ' ' : c
    const d = holds[i] ?? (c === ' ' ? 150 : ms)
    chars.push({ el: span, start: t, end: t + d, text: c })
    t += d
    el.appendChild(span)
  })
  parent.appendChild(el)
  return { el, chars, end: t }
}

/** 一组强调：chars[from, to)；effect / color / factor / styles / hold 同 LyricEmphasis */
function group(line, from, to, opt = {}) {
  if (from < 0 || to > line.chars.length || from >= to)
    throw new Error(`group [${from}, ${to}) out of range for ${line.chars.map(c => c.text).join('')}`)
  const g = { from, to, factor: 1, effect: 'swell', ...opt }
  g.start = line.chars[from].start
  g.end = line.chars[to - 1].end
  if (g.effect === 'shake' && opt.holdIndex != null) {
    const c = line.chars[opt.holdIndex]
    g.hold = { start: c.start, end: c.end }
  }
  return g
}

function holdVibrato(hold, t) {
  const onset = hold.start + Math.min(700, Math.max(250, (hold.end - hold.start) * 0.2))
  const release = t < hold.end ? 1 : Math.max(0, 1 - (t - hold.end) / 300)
  return { onset, release, amount: clamp01((t - onset) / 360) * release }
}

/** 绘制一行：擦除 + 演唱上浮 + 强调；glowBase 为没有颜色时辉光的颜色（情绪或封面取色），scale 为幅度倍数（导航栏用） */
function paintLine(line, groups, t, { glowBase = '#ffffff', amp = 1, lift = true } = {}) {
  const fx = new Map()
  for (const g of groups) {
    const dur = Math.max(1000, g.end - g.start)
    const count = g.to - g.from
    const stagger = dur * (g.effect === 'wave' ? 1 / 1.5 : 1 / 2.5) / Math.max(1, count)
    const tint = g.color ? COLORS[g.color][0] : null
    const charMs = Math.max(1, (g.end - g.start) / count)
    const hold = g.effect === 'shake' && g.hold ? holdVibrato(g.hold, t) : null
    for (let i = 0; i < count; i++) {
      const begin = g.start + stagger * i
      let v = swell((t - begin) / dur)
      if (hold && t >= begin + dur / 2) v = Math.max(v, hold.release)
      const lf = Math.sin(Math.PI * clamp01((t - begin + 400) / (dur * 1.4)))
      const f = g.factor
      let scale = 1, x = 0, y = -lf * 0.05, glow = 0, blur = 0, radius = 0.3
      if (g.effect === 'swell') { scale = 1 + v * 0.14 * f; x = -v * 0.03 * f * (count / 2 - i - 0.5); y -= v * 0.025 * f; glow = v * (0.25 + 0.45 * f) }
      else if (g.effect === 'glow') { scale = 1 + v * 0.04 * f; glow = v * (0.35 + 0.5 * f); radius = 0.45 }
      else if (g.effect === 'shake' && hold) {
        const w = Math.sin(2 * Math.PI * 5.5 * (t - hold.onset) / 1000 - i * 0.35)
        scale = 1 + v * 0.14 * f + w * hold.amount * 0.02 * f
        x = -v * 0.03 * f * (count / 2 - i - 0.5) + Math.cos(2 * Math.PI * 11 * (t - hold.onset) / 1000 + i) * hold.amount * 0.008 * f
        y -= v * 0.025 * f + w * hold.amount * 0.035 * f
        glow = v * (0.25 + 0.45 * f) + hold.amount * 0.12 * f
      }
      else if (g.effect === 'shake') { const ph = (t - begin) / 45; x = Math.sin(ph * 2.3 + i * 1.7) * 0.035 * f * v; y += Math.cos(ph * 1.9 + i * 1.3) * 0.025 * f * v; scale = 1 + v * 0.06 * f; glow = v * (0.15 + 0.25 * f) }
      else if (g.effect === 'focus') { const clear = clamp01((t - begin) / (dur * 0.6)); blur = (1 - clear) * (0.05 + 0.07 * f); scale = 1 + v * 0.05 * f; glow = v * (0.2 + 0.3 * f); radius = 0.4 }
      else if (g.effect === 'wave') { y = -lf * (0.08 + 0.14 * f); scale = 1 + lf * 0.05 * f }
      let color = null
      if (tint) { const k = Math.max(v * 0.85, t >= begin ? 0.6 : 0); if (k > 0.005) color = `color-mix(in srgb, ${tint} ${(k * 100).toFixed(1)}%, #ffffff)` }
      const ln = g.styles && (g.styles.includes('underline') || g.styles.includes('strike')) ? clamp01((t - g.start - charMs * i) / charMs) : null
      fx.set(g.from + i, { scale: 1 + (scale - 1) * amp, x: x * amp, y: y * amp, glow, blur: blur * amp, radius, color, glowColor: tint || glowBase, ln, g })
    }
  }
  line.chars.forEach((c, idx) => {
    const p = clamp01((t - c.start) / (c.end - c.start))
    c.el.style.setProperty('--p', (p * 118 - 18).toFixed(1) + '%')
    const e = fx.get(idx)
    if (e) {
      c.el.style.transform = `translate(${e.x.toFixed(3)}em, ${e.y.toFixed(3)}em) scale(${e.scale.toFixed(3)})`
      const filters = []
      if (e.blur > 0.002) filters.push(`blur(${e.blur.toFixed(3)}em)`)
      if (e.glow > 0.01) filters.push(`drop-shadow(0 0 ${e.radius}em color-mix(in srgb, ${e.glowColor} ${(e.glow * 100).toFixed(0)}%, transparent))`)
      c.el.style.filter = filters.join(' ')
      c.el.style.setProperty('--hi', e.color || '#fff')
      if (e.ln != null) c.el.style.setProperty('--line', e.ln.toFixed(3))
    }
    else {
      // 普通词：唱到时轻微上浮并保持
      const up = lift ? -0.04 * clamp01((t - c.start + 200) / 400) : 0
      c.el.style.transform = `translateY(${up.toFixed(3)}em)`
      c.el.style.filter = ''
      c.el.style.setProperty('--hi', '#fff')
    }
  })
}

function applyStyles(line, g) {
  for (let i = g.from; i < g.to; i++) {
    const el = line.chars[i].el
    if (g.styles?.includes('bold')) el.style.fontWeight = 900
    if (g.styles?.includes('italic')) el.style.fontStyle = 'italic'
    if (g.styles?.includes('underline')) el.classList.add('u')
    if (g.styles?.includes('strike')) el.classList.add('s')
    if (g.font) el.style.fontFamily = FONTS[g.font][1]
  }
}

// ================= 卡片框架 =================
const playing = new Set()
function loop(now) {
  for (const card of [...playing]) {
    const t = now - card.t0 - 300
    card.demo.frame(Math.max(0, t), now)
    if (t > card.demo.duration + 800) { playing.delete(card); card.el.classList.remove('playing') }
  }
  requestAnimationFrame(loop)
}
requestAnimationFrame(loop)

// 演示已由 render 建好，这里只从头开始计时
function play(card) {
  card.t0 = performance.now()
  playing.add(card)
  card.el.classList.add('playing')
}

const SECTIONS = []
function section(title, note, cards) { SECTIONS.push({ title, note, cards }) }

// ---------- 一、基础引擎 ----------
section('一、基础歌词引擎', '逐字歌词播放时一直都有，不需要标注', [
  { title: '逐字擦除 + 演唱上浮', tags: [['auto', '自动'], ['where', '播放器 / 小窗 / 单曲卡']],
    desc: '带羽化边缘的遮罩从左到右擦亮每个字（羽化宽度约 0.5 字），唱到的字轻微上浮并保持；只有逐字歌词有，逐行歌词整行高亮。',
    build(stage) {
      const line = buildLine(stage, '风吹过的街道 我还在等你', { ms: 330 })
      return { duration: line.end, frame: t => paintLine(line, [], t) }
    } },
  { title: '行切换：弹簧滚动 + 阶梯入场 + 景深模糊', tags: [['auto', '自动']],
    desc: '每行由弹簧驱动位置与缩放，换行时离焦点越远的行越晚出发（阶梯入场）；非焦点行按距离逐级模糊、变暗、缩小。',
    build(stage) {
      stage.style.alignItems = 'flex-start'
      const texts = ['夜色 慢慢落下', '路灯 一盏一盏亮起', '我数着 你离开的脚步', '风里 还有你的味道', '天亮之前 再想你一遍', '然后 好好告别']
      const box = document.createElement('div')
      box.style.cssText = 'position:absolute;inset:0'
      stage.appendChild(box)
      const rows = texts.map((tx) => {
        const r = document.createElement('div')
        r.className = 'lyric small'
        r.textContent = tx
        r.style.cssText += 'position:absolute;left:28px;top:0;transform-origin:left center;transition:transform .75s cubic-bezier(.25,1.35,.45,1),filter .5s,opacity .5s'
        box.appendChild(r)
        return r
      })
      let focus = -1
      const set = (f) => {
        focus = f
        rows.forEach((r, i) => {
          const d = i - f
          r.style.transitionDelay = `${Math.abs(d) * 45}ms`
          r.style.transform = `translateY(${62 + d * 34}px) scale(${d === 0 ? 1 : 0.9})`
          r.style.filter = `blur(${Math.min(4, Math.abs(d) * 1.3)}px)`
          r.style.opacity = d === 0 ? 1 : Math.max(0.15, 0.55 - Math.abs(d) * 0.12)
        })
      }
      set(0)
      return { duration: 5400, frame: t => { const f = Math.min(texts.length - 1, Math.floor(t / 1000)); if (f !== focus) set(f) } }
    } },
  { title: '间奏倒计时圆点', tags: [['auto', '自动'], ['where', '间奏 ≥ 数秒时']],
    desc: '三个圆点依次淡入，间奏开始后按时间依次点亮（倒计时），全程吸气 / 呼气式呼吸；结束前先放大，再向中间收拢淡出，随后下一行入场。',
    build(stage) {
      const wrap = document.createElement('div')
      wrap.style.cssText = 'display:flex;gap:14px'
      const dots = [0, 1, 2].map(() => { const d = document.createElement('i'); d.style.cssText = 'width:16px;height:16px;border-radius:50%;background:#fff;display:block'; wrap.appendChild(d); return d })
      stage.appendChild(wrap)
      const D = 5200
      return { duration: D, frame: (t) => {
        const breath = 1 + 0.12 * Math.sin(t / 900 * Math.PI)
        const out = clamp01((t - (D - 600)) / 600)
        dots.forEach((d, i) => {
          const appear = clamp01((t - i * 160) / 400)
          const lit = t > 900 + i * 1100 ? 1 : 0
          const toCenter = (1 - i) * 30 * out
          d.style.opacity = (appear * (0.25 + 0.75 * lit) * (1 - out)).toFixed(3)
          d.style.transform = `translateX(${toCenter}px) scale(${(breath * (out > 0 ? 1.15 - out : 1)).toFixed(3)})`
        })
      } }
    } },
  { title: '背景人声 / 对唱', tags: [['auto', '自动'], ['where', 'TTML 歌词']],
    desc: '对唱的另一位歌手右对齐；背景人声（和声）以小字跟在主唱行下，上浮幅度是主唱的两倍。数据来自 TTML 的 agent 与背景标记。',
    build(stage) {
      stage.style.flexDirection = 'column'; stage.style.alignItems = 'stretch'; stage.style.padding = '0 28px'; stage.style.gap = '2px'
      const a = buildLine(stage, '你听 风在唱歌', { ms: 300, cls: 'small' })
      const bg = buildLine(stage, '（啦 啦 啦）', { ms: 260, cls: 'small', start: 900 })
      bg.el.style.fontSize = '13px'; bg.el.style.opacity = '.75'
      const b = buildLine(stage, '我听见了 就在耳边', { ms: 300, cls: 'small', start: 2300 })
      b.el.style.textAlign = 'right'; b.el.style.marginTop = '14px'
      return { duration: b.end, frame: (t) => { paintLine(a, [], t); paintLine(bg, [], t, {}); bg.chars.forEach(c => { if (t >= c.start) c.el.style.transform = 'translateY(-0.12em)' }); paintLine(b, [], t) } }
    } },
  { title: '逐音节音译', tags: [['auto', '自动'], ['where', '日语 / 韩语等']],
    desc: '罗马音按音节对齐到原文的每个字下方，与原文同步擦亮；平台音译带逐字时间时直接使用，否则按假名读音对齐。',
    build(stage) {
      const pairs = [['夢', 'yu me'], ['を', 'wo'], ['見', 'mi'], ['て', 'te'], ['い', 'i'], ['た', 'ta']]
      const line = { chars: [] }
      const el = document.createElement('div'); el.className = 'lyric'
      let t = 0
      for (const [c, r] of pairs) {
        const col = document.createElement('span'); col.style.cssText = 'display:inline-flex;flex-direction:column;align-items:center;margin:0 2px'
        const s = document.createElement('span'); s.className = 'ch'; s.textContent = c
        const ro = document.createElement('span'); ro.className = 'ch roman'; ro.textContent = r
        col.append(s, ro); el.appendChild(col)
        const d = c === '夢' ? 700 : 420
        line.chars.push({ el: s, start: t, end: t + d }, { el: ro, start: t, end: t + d })
        t += d
      }
      stage.appendChild(el)

// ---------- 粒子场景（简化重绘，参数取意） ----------
const SCENES = {
  petals: ['花瓣', '#ffb3c8'], sparks: ['火花', '#ffb347'], snow: ['雪花', '#ffffff'], stars: ['星空', '#fff6c8'], bubbles: ['气泡', '#b5e8ff'], rain: ['雨', '#9bb7d4'],
  leaves: ['落叶', '#ff9a4d'], fireflies: ['萤火虫', '#d9ff8a'], feathers: ['羽毛', '#f0f4ff'], hearts: ['爱心', '#ff6f91'], confetti: ['彩纸', '*'], fireworks: ['烟花', '*'],
  dandelion: ['蒲公英', '#f6f3e8'], butterflies: ['蝴蝶', '#c3a6ff'], meteors: ['流星', '#e6efff'], clouds: ['云', '#dfe6f3'], ripples: ['涟漪', '#8fd3ff'], notes: ['音符', '#ffe0a3'],
}
const MULTI = ['#ff6f91', '#ffd54f', '#74c0fc', '#8ef0c8', '#c3a6ff', '#ff9f80']
function particleScene(canvas, scene, theme) {
  const ctx = canvas.getContext('2d')
  const W = canvas.width, H = canvas.height
  const parts = []
  const color = () => theme || (SCENES[scene][1] === '*' ? MULTI[Math.random() * MULTI.length | 0] : SCENES[scene][1])
  const rnd = (a, b) => a + Math.random() * (b - a)
  const spawn = () => {
    const p = { x: rnd(0, W), y: -20, vx: rnd(-15, 15), vy: rnd(30, 60), r: rnd(3, 7), a: 0, rot: rnd(0, 6), vr: rnd(-1.5, 1.5), life: 0, max: rnd(5, 9), c: color(), ph: rnd(0, 6) }
    if (['sparks', 'bubbles', 'hearts', 'notes', 'fireflies', 'dandelion'].includes(scene)) { p.y = H + 20; p.vy = -rnd(25, 60) }
    if (scene === 'fireflies' || scene === 'stars') { p.y = rnd(0, H); p.vy = rnd(-8, 8); p.vx = rnd(-8, 8) }
    if (scene === 'rain') { p.vy = rnd(380, 520); p.vx = -40; p.r = rnd(10, 18) }
    if (scene === 'snow') { p.vy = rnd(20, 45); p.r = rnd(1.5, 3.5) }
    if (scene === 'meteors') { p.x = rnd(W * 0.3, W * 1.2); p.y = rnd(-40, H * 0.3); p.vx = -rnd(320, 420); p.vy = rnd(160, 220); p.max = 1.4 }
    if (scene === 'clouds') { p.x = -120; p.y = rnd(10, H - 40); p.vx = rnd(12, 22); p.vy = 0; p.r = rnd(30, 55); p.max = 40 }
    if (scene === 'ripples') { p.x = rnd(40, W - 40); p.y = rnd(40, H - 30); p.vx = p.vy = 0; p.max = 2.6 }
    if (scene === 'dandelion') { p.vx = rnd(20, 40) }
    if (scene === 'fireworks') { p.x = rnd(W * 0.2, W * 0.8); p.y = rnd(H * 0.15, H * 0.5); p.vx = p.vy = 0; p.max = 1.8; p.burst = Array.from({ length: 26 }, (_, i) => ({ ang: i / 26 * Math.PI * 2, sp: rnd(50, 90) })) }
    parts.push(p)
  }
  const rate = { rain: 40, snow: 14, stars: 5, meteors: 1.6, clouds: 0.5, ripples: 1.4, fireworks: 1.3, fireflies: 4, confetti: 10 }[scene] ?? 6
  // 稀疏的场景一开始就放几个，不用等
  let acc = { clouds: 3, meteors: 1.5, fireworks: 1.5 }[scene] ?? 0
  if (scene === 'clouds') { for (let k = 0; k < 3; k++) { spawn(); parts[parts.length - 1].x = Math.random() * W; parts[parts.length - 1].life = 1 } acc = 0 }
  return (dt, density) => {
    acc += dt * rate * density
    while (acc > 1) { spawn(); acc -= 1 }
    ctx.clearRect(0, 0, W, H)
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]
      p.life += dt
      if (p.life > p.max || p.y > H + 40 || p.y < -60 || p.x < -160 || p.x > W + 160) { parts.splice(i, 1); continue }
      p.x += p.vx * dt + (['petals', 'leaves', 'feathers', 'snow', 'dandelion', 'butterflies'].includes(scene) ? Math.sin(p.life * 1.6 + p.ph) * 18 * dt : 0)
      p.y += p.vy * dt
      p.rot += p.vr * dt
      const fade = Math.min(1, p.life / 0.6, (p.max - p.life) / 0.8)
      ctx.save(); ctx.globalAlpha = Math.max(0, fade) * 0.9; ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = ctx.strokeStyle = p.c
      switch (scene) {
        case 'petals': ctx.beginPath(); ctx.ellipse(0, 0, p.r * 1.3, p.r * 0.7, 0, 0, 7); ctx.fill(); break
        case 'leaves': ctx.beginPath(); ctx.ellipse(0, 0, p.r * 1.6, p.r * 0.6, 0, 0, 7); ctx.fill(); break
        case 'feathers': ctx.beginPath(); ctx.ellipse(0, 0, p.r * 2.4, p.r * 0.5, 0, 0, 7); ctx.globalAlpha *= 0.7; ctx.fill(); break
        case 'snow': case 'dandelion': ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 7); ctx.fill(); if (scene === 'dandelion') { ctx.globalAlpha *= 0.5; for (let k = 0; k < 6; k++) { ctx.rotate(1.05); ctx.fillRect(0, -0.5, p.r * 2.4, 1) } } break
        case 'sparks': ctx.shadowBlur = 10; ctx.shadowColor = p.c; ctx.beginPath(); ctx.arc(0, 0, p.r * 0.45, 0, 7); ctx.fill(); break
        case 'stars': ctx.globalAlpha *= 0.4 + 0.6 * Math.abs(Math.sin(p.life * 3 + p.ph)); ctx.beginPath(); for (let k = 0; k < 4; k++) { ctx.rotate(Math.PI / 2); ctx.moveTo(0, 0); ctx.lineTo(p.r * 0.35, p.r * 0.35); ctx.lineTo(0, p.r * 1.3) } ctx.fill(); break
        case 'bubbles': ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(0, 0, p.r * 1.4, 0, 7); ctx.stroke(); break
        case 'rain': ctx.rotate(-p.rot + 0.08); ctx.globalAlpha *= 0.6; ctx.fillRect(0, 0, 1.2, p.r); break
        case 'fireflies': ctx.shadowBlur = 14; ctx.shadowColor = p.c; ctx.globalAlpha *= 0.5 + 0.5 * Math.sin(p.life * 4 + p.ph); ctx.beginPath(); ctx.arc(0, 0, 2.4, 0, 7); ctx.fill(); break
        case 'hearts': ctx.rotate(-p.rot); ctx.font = `${p.r * 3.2}px sans-serif`; ctx.fillText('♥', 0, 0); break
        case 'notes': ctx.rotate(-p.rot * 0.3); ctx.font = `${p.r * 3.4}px sans-serif`; ctx.fillText(p.ph > 3 ? '♪' : '♫', 0, 0); break
        case 'confetti': ctx.fillRect(-p.r, -p.r * 0.4, p.r * 2, p.r * 0.8); break
        case 'butterflies': { ctx.rotate(-p.rot); const w = Math.abs(Math.sin(p.life * 9)); ctx.beginPath(); ctx.ellipse(-p.r * 0.8 * w, 0, p.r * w, p.r * 1.1, 0, 0, 7); ctx.ellipse(p.r * 0.8 * w, 0, p.r * w, p.r * 1.1, 0, 0, 7); ctx.fill(); break }
        case 'meteors': { ctx.rotate(-p.rot); const g = ctx.createLinearGradient(0, 0, 90, -45); g.addColorStop(0, p.c); g.addColorStop(1, 'transparent'); ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(90, -45); ctx.stroke(); break }
        case 'clouds': { ctx.rotate(-p.rot); const g = ctx.createRadialGradient(0, 0, 0, 0, 0, p.r * 1.8); g.addColorStop(0, p.c); g.addColorStop(1, 'transparent'); ctx.fillStyle = g; ctx.globalAlpha *= 0.35; ctx.scale(1, 0.4); ctx.beginPath(); ctx.arc(0, 0, p.r * 1.8, 0, 7); ctx.fill(); break }
        case 'ripples': { ctx.rotate(-p.rot); const k = p.life / p.max; ctx.globalAlpha = (1 - k) * 0.8; ctx.lineWidth = 1.5; for (let j = 0; j < 2; j++) { ctx.beginPath(); ctx.ellipse(0, 0, (k * 60) + j * 10, ((k * 60) + j * 10) * 0.35, 0, 0, 7); ctx.stroke() } break }
        case 'fireworks': { ctx.rotate(-p.rot); const k = p.life; for (const b of p.burst) { ctx.globalAlpha = Math.max(0, 1 - k / p.max); ctx.beginPath(); ctx.arc(Math.cos(b.ang) * b.sp * k, Math.sin(b.ang) * b.sp * k + 20 * k * k, 1.8, 0, 7); ctx.fill() } break }
      }
      ctx.restore()
    }
  }
}

section('六、粒子场景（18 种）', 'AI 为写到具体画面的行选择场景，持续约 8 行或到下一个场景；可指定颜色主题。全曲最多 6 处', [

// ================= 渲染 =================
const main = document.getElementById('main')
let total = 0
const counts = []
for (const s of SECTIONS) {
  const sec = document.createElement('section')
  sec.innerHTML = `<h2>${s.title}<small>${s.note}</small></h2>`
  const grid = document.createElement('div'); grid.className = 'grid'
  for (const def of s.cards) {
    total++
    const el = document.createElement('div'); el.className = 'card' + (def.wide ? ' wide' : '') + (def.tags.some(([k]) => k === 'new') ? ' cand' : '')
    const stage = document.createElement('div'); stage.className = 'stage' + (def.tall ? ' tall' : '')
    const meta = document.createElement('div'); meta.className = 'meta'
    meta.innerHTML = `<h3>${def.title}${def.tags.map(([k, n]) => `<span class="tag t-${k}">${n}</span>`).join('')}</h3><p>${def.desc}</p>`
    el.append(stage, meta)
    const card = { el, def, stage, options: { ...(def.options || {}) } }
    const reset = () => { stage.innerHTML = ''; stage.removeAttribute('style'); playing.delete(card); el.classList.remove('playing') }
    const render = (autoplay) => { reset(); card.demo = def.build(stage, card.options); card.demo.frame(0, 0); const h = document.createElement('span'); h.className = 'hint'; h.textContent = '点击播放 ▶'; stage.appendChild(h); if (autoplay) play(card) }
    if (def.chips) {
      const chips = document.createElement('div'); chips.className = 'chips'
      for (const c of def.chips()) {
        const b = document.createElement('span'); b.className = 'chip'; b.dataset.key = c.key; b.dataset.value = c.value
        b.innerHTML = (c.dot ? `<i style="background:${c.dot}"></i>` : '') + c.label
        if (card.options[c.key] === c.value) b.classList.add('on')
        b.onclick = (e) => { e.stopPropagation(); card.options[c.key] = c.value; chips.querySelectorAll(`[data-key="${c.key}"]`).forEach(x => x.classList.toggle('on', x === b)); render(true) }
        chips.appendChild(b)
      }
      el.appendChild(chips)
    }
    el.addEventListener('click', () => render(true))
    grid.appendChild(el)
    requestAnimationFrame(() => render(false))
  }
  sec.appendChild(grid); main.appendChild(sec)
  counts.push([s.title.replace(/^.、/, '').replace(/（.*）/, ''), s.cards.length])
}
document.getElementById('summary').innerHTML = `<span class="pill">共 <b>${total}</b> 张演示</span>` + [['词强调特效', '5 种 + 长音颤音'], ['颜色', '32 种'], ['字体', '7 种'], ['字形', '4 种'], ['情绪色温', '4 种'], ['粒子场景', '18 种'], ['舞台效果', '5 种'], ['文字时刻', '4 种'], ['基础引擎', '5 项'], ['候选新动效', '5 个']].map(([a, b]) => `<span class="pill">${a} <b>${b}</b></span>`).join('')
</script>
