<script>
// 博客地址：音频经博客后端代理（302 到网易云 CDN，试听用 192k 的 higher 音质，加载更快），「完整收听」打开博客的播放器页
// 本地测试时可用 ?site=http://localhost:端口 指向其他后端
const SITE = new URLSearchParams(location.search).get('site') || 'https://blog.sfkm.me'

/** 短语在行内的字下标区间（按字符，含空格） */
function span(text, phrase) {
  const chars = [...text], target = [...phrase]
  for (let i = 0; i + target.length <= chars.length; i++)
    if (target.every((c, k) => chars[i + k] === c)) return [i, i + target.length]
  throw new Error(`「${phrase}」不在「${text}」里`)
}

/** 由逐字歌词建一行：一个音节有多个字时平分它的时长；时间换算为相对片段开头 origin 的毫秒 */
function buildWordsLine(parent, words, origin) {
  const el = document.createElement('div')
  el.className = 'lyric'
  const chars = []
  for (const [text, start, end] of words) {
    const cs = [...text]
    const per = (end - start) / Math.max(1, cs.length)
    cs.forEach((c, k) => {
      const node = document.createElement('span')
      node.className = 'ch' + (c === ' ' ? ' sp' : '')
      node.textContent = c === ' ' ? ' ' : c
      chars.push({ el: node, start: start - origin + per * k, end: start - origin + per * (k + 1), text: c })
      el.appendChild(node)
    })
  }
  parent.appendChild(el)
  return { el, chars, end: chars.at(-1).end }
}

/** 建一个场景：几行真实歌词，目标行带短语特效；shake 的短语里唱满 1.2 秒以上的字作为长音（颤音） */
function buildScene(parent, lines, origin) {
  return lines.map((spec) => {
    const row = document.createElement('div'); row.className = 'row'; parent.appendChild(row)
    const line = buildWordsLine(row, spec.words, origin)
    line.row = row
    line.start = line.chars[0].start
    const text = line.chars.map(c => c.text).join('')
    line.groups = spec.phrases.map(([phrase, opt]) => {
      const [from, to] = span(text, phrase)
      let holdIndex
      if (opt.effect === 'shake') {
        let longest = 1200
        for (let i = from; i < to; i++) {
          const d = line.chars[i].end - line.chars[i].start
          if (d > longest) { longest = d; holdIndex = i }
        }
      }
      const g = group(line, from, to, { ...opt, holdIndex })
      applyStyles(line, g)
      return g
    })
    return line
  })
}

function currentIndex(lines, t) {
  let current = 0
  lines.forEach((line, i) => { if (t >= line.start - 150) current = i })
  return current
}

function paintScene(lines, t, opts) {
  const current = currentIndex(lines, t)
  lines.forEach((line, i) => {
    const active = i === current
    line.row.style.opacity = active ? '1' : '0.42'
    line.row.style.filter = active ? '' : 'blur(1px)'
    paintLine(line, line.groups, t, opts)
  })
}

/** 字号：最长的一行放得下（默认 26px） */
function fitFont(stage, lines) {
  const longest = Math.max(...lines.map(l => l.chars.reduce((w, c) => w + (/[\x00-\xff]/.test(c.text) ? 0.55 : 1), 0)))
  const room = stage.clientWidth - (stage.clientWidth < 420 ? 32 : 56)
  stage.style.setProperty('--fs', `${Math.max(14, Math.min(26, room / (longest * 1.06))).toFixed(1)}px`)
}

/** 普通场景：依次演唱，当前行高亮；有破碎时加碎片层与背景闪光（同 stage-effects.ts 的 shatterFlash） */
const scene = (key, title, effect, why, avoid, extra = {}) => ({
  key, title, effect, why, avoid, ...extra,
  build(stage, origin) {
    const lines = buildScene(stage, SHOWCASE[key].lines, origin)
    fitFont(stage, lines)
    const shatters = lines.flatMap(l => l.groups.filter(g => g.effect === 'shatter'))
    const debris = shatters.length > 0 ? new ShardLayer(stage) : null
    const flash = debris && Object.assign(document.createElement('div'), { className: 'bgfx' })
    if (flash) { flash.style.background = 'radial-gradient(60% 70% at 40% 50%, rgba(255,255,255,.22), transparent 70%)'; flash.style.opacity = '0'; stage.appendChild(flash) }
    return { frame: (t) => {
      paintScene(lines, t, { debris })
      if (!debris) return
      debris.draw(t)
      const k = Math.max(0, ...shatters.map(g => { const d = t - g.end - 60; return d < 0 || d > 1100 ? 0 : Math.exp(-d / 220) }))
      flash.style.opacity = k.toFixed(3)
    } }
  },
})

// ================= 播放：原曲片段驱动动画时间（音频不可用时按本机时钟静音演示） =================
// 片段：从演示那一句的前一句最后一两个字开始（相隔太远时只提前一点），唱完这一句再留一点余韵；
// fullPrevious 的卡片（聚光灯）完整唱一遍前一句做铺垫，点题句亮起时才有分量
const KEEP_BEFORE_MS = 2500
const LEAD = 700

function clipOf(key, { fullPrevious = false } = {}) {
  const lines = SHOWCASE[key].lines
  const index = lines.findIndex(l => l.target)
  const target = lines[index]
  const start = target.words[0][1]
  let origin = start - LEAD
  const sung = (lines[index - 1]?.words ?? []).filter(w => w[0].trim())
  const keep = fullPrevious ? sung[0] : sung[Math.max(0, sung.length - 2)]
  if (keep && (fullPrevious || start - keep[1] <= KEEP_BEFORE_MS))
    origin = Math.min(origin, keep[1] - (fullPrevious ? 400 : 200))
  return { origin, end: target.words.at(-1)[2] }
}

const withAudio = document.getElementById('with-audio')
// 点击后等待原曲的最长时间（地址已预取，通常不到 1 秒）
const LOAD_TIMEOUT_MS = 15000
let active = null
let audioContext = null

/**
 * 只加载片段：向后端要歌曲的临时地址（网易云 CDN，支持 Range 与跨源），先读开头几 KB 解析 MP3 帧头，
 * 按恒定码率算出片段所在的字节范围，只下载这一段并用 Web Audio 解码播放。
 * 不是恒定码率的 MP3 或任何一步失败时返回 null，改用 <audio> 播放
 */
const clipCache = new Map()
const MP3_BITRATES = [0, 32, 40, 48, 56, 64, 80, 96, 112, 128, 160, 192, 224, 256, 320, 0]
const MP3_RATES = [44100, 48000, 32000, 0]

async function fetchRange(url, from, to) {
  const abort = new AbortController()
  const res = await fetch(url, { headers: { Range: `bytes=${from}-${to}` }, signal: abort.signal })
  // 不支持 Range 时会返回整首，立即放弃
  if (res.status !== 206) { abort.abort(); throw new Error(`range ${res.status}`) }
  return new Uint8Array(await res.arrayBuffer())
}

/** 解析 MP3 开头：跳过 ID3v2，读第一帧的码率与采样率；第一帧是 Info（恒定码率）标记帧时从下一帧算起，Xing（可变码率）不支持 */
async function mp3Layout(url) {
  let head = await fetchRange(url, 0, 8191)
  let base = 0
  if (head[0] === 0x49 && head[1] === 0x44 && head[2] === 0x33) {
    base = 10 + (((head[6] & 0x7F) << 21) | ((head[7] & 0x7F) << 14) | ((head[8] & 0x7F) << 7) | (head[9] & 0x7F)) + (head[5] & 0x10 ? 10 : 0)
    // ID3 里有封面图时帧头在更后面
    if (base > head.length - 512) { head = await fetchRange(url, base, base + 8191); base = -base }
  }
  const offset = base < 0 ? -base : 0
  let pos = base < 0 ? 0 : base
  while (pos < head.length - 4 && !(head[pos] === 0xFF && (head[pos + 1] & 0xE0) === 0xE0)) pos++
  const version = (head[pos + 1] >> 3) & 3, layer = (head[pos + 1] >> 1) & 3
  const bitrate = MP3_BITRATES[head[pos + 2] >> 4], rate = MP3_RATES[(head[pos + 2] >> 2) & 3]
  if (version !== 3 || layer !== 1 || !bitrate || !rate) throw new Error('not mpeg1 layer3')
  const frameBytes = 144000 * bitrate / rate
  const tag = String.fromCharCode(...head.slice(pos + 4, pos + 60)).match(/Xing|Info/)?.[0]
  if (tag === 'Xing') throw new Error('vbr')
  const first = offset + pos + (tag === 'Info' ? Math.floor(frameBytes) + ((head[pos + 2] >> 1) & 1) : 0)
  // 编码器延迟（LAME 默认 576 + 529 个采样）：整首解码时开头多出这一段，按片段解码时没有，需要扣掉才能与整首的时间对齐
  return { first, frameBytes, frameMs: 1152 / rate * 1000, delayMs: 1105 / rate * 1000 }
}

/**
 * 每首歌的临时地址与帧布局：进入页面后在后台依次获取（换地址要后端去问网易云，冷启动可能要几秒），点击时直接用。
 * 地址几分钟后过期，超过 SOURCE_TTL_MS 重新获取；后端没有 /audio/url 时记下来，点击后直接用整首的 <audio>
 */
const SOURCE_TTL_MS = 8 * 60 * 1000
const sources = new Map()
let clipEndpoint = 'unknown'

function sourceOf(song) {
  const cached = sources.get(song.id)
  if (cached && performance.now() - cached.at < SOURCE_TTL_MS) return cached.promise
  const promise = (async () => {
    let res
    try {
      res = await fetch(`${SITE}/api/v1/music/song/${song.id}/audio/url?level=higher`)
    }
    catch (error) {
      // 旧版后端没有这个接口时，404 不带跨源响应头，浏览器只报网络错误
      if (clipEndpoint !== 'ok') clipEndpoint = 'missing'
      throw error
    }
    if (!res.ok) {
      // 失败也可能是这首歌不在白名单内：只要有一首成功就说明后端支持
      if (clipEndpoint !== 'ok') clipEndpoint = 'missing'
      throw new Error(`url ${res.status}`)
    }
    clipEndpoint = 'ok'
    const url = (await res.json()).data.url
    return { url, ...(await mp3Layout(url)) }
  })()
  sources.set(song.id, { promise, at: performance.now() })
  promise.catch(() => sources.delete(song.id))
  return promise
}

/** 进入页面后在后台预取所有歌曲的地址与帧布局，同时最多 3 个请求，不阻塞页面 */
async function prefetchSources(songs) {
  const queue = [...new Map(songs.map(song => [song.id, song])).values()]
  const worker = async () => {
    while (queue.length > 0) {
      const song = queue.shift()
      await sourceOf(song).catch(() => {})
    }
  }
  await Promise.all([worker(), worker(), worker()])
}

function loadClip(card) {
  const key = `${card.song.id}:${card.clip.origin}`
  if (!clipCache.has(key)) {
    const promise = (async () => {
      const { url, first, frameBytes, frameMs, delayMs } = await sourceOf(card.song)
      // 前后各多取约 0.3 秒，避免解码器丢掉开头的帧
      const fromFrame = Math.max(0, Math.floor((card.clip.origin - 300) / frameMs))
      const toFrame = Math.ceil((card.clip.end + card.tail + 300) / frameMs)
      const bytes = await fetchRange(url, first + Math.floor(fromFrame * frameBytes), first + Math.ceil(toFrame * frameBytes))
      // 解码不需要用户手势：还没有音频上下文时先建一个（处于暂停状态，点击时再恢复）
      audioContext ??= new AudioContext()
      const buffer = await audioContext.decodeAudioData(bytes.buffer)
      return { buffer, start: fromFrame * frameMs - delayMs }
    })()
    clipCache.set(key, promise)
    promise.catch(() => clipCache.delete(key))
  }
  return clipCache.get(key)
}

// 回退：整首的 <audio>（后端尚不支持片段地址或解码失败时）；片段结束后清掉地址，不再继续缓冲
const audio = new Audio()
audio.preload = 'none'

function stopActive() {
  if (!active) return
  const { card } = active
  if (active.source) { try { active.source.stop() } catch {} active.gain.disconnect() }
  if (active.mode === 'element' || active.mode === 'loading') { audio.pause(); audio.removeAttribute('src'); audio.load() }
  active = null
  card.el.classList.remove('playing')
  card.setHint('点击播放 ▶')
}

function useClock(card, hint) {
  if (active?.card !== card || active.mode === 'webaudio' || active.mode === 'element') return
  active.mode = 'clock'; active.t0 = performance.now()
  card.setHint(hint)
}

function playWithElement(card) {
  if (active?.card !== card) return
  // 超时从音频真正开始加载时算起
  Object.assign(active, { mode: 'loading', since: performance.now() })
  audio.src = `${SITE}/api/v1/music/song/${card.song.id}/audio?level=higher`
  audio.currentTime = card.clip.origin / 1000
  audio.volume = 1
  audio.play().then(() => {
    if (active?.card !== card) return
    if (Math.abs(audio.currentTime * 1000 - card.clip.origin) > 1500) audio.currentTime = card.clip.origin / 1000
    active.mode = 'element'
    card.setHint('播放中')
  }, () => useClock(card, '原曲无法播放，静音演示'))
}

function startCard(card) {
  stopActive()
  card.render()
  active = { card, mode: 'loading', since: performance.now() }
  card.el.classList.add('playing')
  if (!withAudio.checked) { useClock(card, '静音演示'); return }
  card.setHint('加载原曲片段…')
  // 在点击中创建 / 恢复音频上下文（浏览器的自动播放限制）
  try {
    audioContext ??= new AudioContext()
    audioContext.resume()
  }
  catch { audioContext = null }
  // 后端没有片段地址：在点击中直接用 <audio>（不白等一次 404，也保留用户手势）
  if (!audioContext || clipEndpoint === 'missing') { playWithElement(card); return }
  loadClip(card).then(({ buffer, start }) => {
    if (active?.card !== card) return
    const gain = audioContext.createGain()
    gain.connect(audioContext.destination)
    const source = audioContext.createBufferSource()
    source.buffer = buffer
    source.connect(gain)
    source.start(0, Math.max(0, (card.clip.origin - start) / 1000))
    Object.assign(active, { mode: 'webaudio', source, gain, startedAt: audioContext.currentTime })
    card.setHint('播放中')
  }, () => playWithElement(card))
}

audio.addEventListener('error', () => active?.mode === 'loading' && audio.getAttribute('src') && useClock(active.card, '原曲加载失败，静音演示'))

/** 当前时间（相对片段开头的毫秒），还在加载时为 0 */
function clipTime(now) {
  switch (active.mode) {
    case 'webaudio': return (audioContext.currentTime - active.startedAt) * 1000
    case 'element': return audio.currentTime * 1000 - active.card.clip.origin
    case 'clock': return now - active.t0
    default: return 0
  }
}

function tick(now) {
  if (active) {
    const { card } = active
    // 加载超过 LOAD_TIMEOUT_MS 仍未开始播放：改为静音演示
    if (active.mode === 'loading' && now - active.since > LOAD_TIMEOUT_MS) { audio.pause(); useClock(card, '原曲加载太慢，静音演示') }
    const t = clipTime(now)
    const duration = card.clip.end - card.clip.origin + card.tail
    // 结尾 0.7 秒淡出
    const volume = Math.min(1, Math.max(0, (duration - t) / 700))
    if (active.mode === 'webaudio') active.gain.gain.value = volume
    if (active.mode === 'element') audio.volume = volume
    card.demo.frame(Math.max(0, t), now)
    if (t > duration) stopActive()
  }
  requestAnimationFrame(tick)
}
requestAnimationFrame(tick)

// ================= 渲染 =================
document.getElementById('flow').innerHTML = CATEGORIES.map(c => `<a class="step" style="--c:${c.c}" href="#${c.key}"><em>${c.verb} →</em><b>${c.name}</b><span>${[...new Set(c.cards.map(card => card.effect))].join(' · ')}</span></a>`).join('')

const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]))
const main = document.getElementById('main')
const cards = []
for (const cat of CATEGORIES) {
  const sec = document.createElement('section'); sec.id = cat.key; sec.style.setProperty('--c', cat.c)
  sec.innerHTML = `<h2><i></i>${cat.name}<small>${cat.verb}</small></h2><p class="cat-desc">${cat.desc}</p>`
  const grid = document.createElement('div'); grid.className = 'grid'
  for (const def of cat.cards) {
    const song = SHOWCASE[def.key]
    const el = document.createElement('div'); el.className = 'card' + (def.tall ? ' tall' : '')
    const stage = document.createElement('div'); stage.className = 'stage'
    const clip = clipOf(def.key, { fullPrevious: def.fullPrevious })
    const listen = `${SITE}/music?id=${song.id}&start=${Math.max(0, clip.origin / 1000 - 3).toFixed(2)}`
    const info = document.createElement('div'); info.className = 'song'
    info.innerHTML = `<img src="${esc(song.cover)}?param=68y68" alt="" loading="lazy" referrerpolicy="no-referrer"><div class="info"><b>${esc(song.name)}</b><span>${esc(song.artists.join(' / '))}</span></div><a href="${esc(listen)}" target="_blank" rel="noopener noreferrer">完整收听 ↗</a>`
    const meta = document.createElement('div'); meta.className = 'meta'
    meta.innerHTML = `<h3>${def.title}<span class="tag">${def.effect}</span>${def.auto ? '<span class="tag auto">播放器自动</span>' : ''}</h3><p><b>为什么</b>${def.why}</p><p class="avoid"><b>不适合</b>${def.avoid}</p>`
    el.append(stage, info, meta)
    const card = { el, def, stage, song, clip, tail: def.tail ?? 1000 }
    card.setHint = (text) => { const hint = stage.querySelector('.hint'); if (hint) hint.textContent = text }
    card.render = () => {
      stage.innerHTML = ''; stage.removeAttribute('style')
      card.demo = def.build(stage, clip.origin)
      card.demo.frame(0, 0)
      stage.insertAdjacentHTML('beforeend', '<span class="hint">点击播放 ▶</span>')
    }
    stage.addEventListener('click', () => (active?.card === card ? stopActive() : startCard(card)))
    grid.appendChild(el)
    cards.push(card)
  }
  sec.appendChild(grid); main.appendChild(sec)
}
requestAnimationFrame(() => cards.forEach(card => card.render()))
// 进入页面就在后台换地址；鼠标移到卡片上（触屏为按下）时预取这一段片段
prefetchSources(cards.map(card => card.song))
for (const card of cards) {
  const warm = () => { if (withAudio.checked && clipEndpoint !== 'missing') loadClip(card).catch(() => {}) }
  card.stage.addEventListener('pointerenter', warm)
  card.stage.addEventListener('touchstart', warm, { passive: true })
}
// 窗口大小变化时重排（不打断正在播放的卡片）
let resizeTimer
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer)
  resizeTimer = setTimeout(() => cards.forEach(card => { if (active?.card !== card) card.render() }), 200)
})
</script>
</body>
</html>
