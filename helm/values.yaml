# 初始副本数
replicaCount: 1

# 滚动更新：先起新实例，新实例就绪（探针通过）后再停旧实例，单副本时也不会中断服务
rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

# 退出时间（秒）：后端收到 SIGTERM 后先让就绪检查失败并等待 5 秒（SHUTDOWN_DELAY_SECONDS）、
# 再优雅关停 HTTP 服务（5 秒），最后等待已领取的 AI 用户任务（15 秒），合计不超过这个时间
terminationGracePeriodSeconds: 30

# 前端收到 SIGTERM 前等待的秒数（preStop），留给负载均衡摘掉正在退出的实例
frontendPreStopSleepSeconds: 5

# 镜像设置
image:
  registry: docker.io
  backend: snowykami/neo-blog-backend
  backendTag: latest
  frontend: snowykami/neo-blog-frontend
  frontendTag: latest
  pullPolicy: IfNotPresent

# 是否启用前端
frontend:
  enabled: true

backend:
  # 是否暴露后端
  expose: false

  # 后端环境变量
  env:
    # Captcha settings 机器人挑战配置
    # 开发模式下的直接通过验证码
    CAPTCHA_DEV_PASSCODE: "114514"
    # captcha类型，支持turnstile recaptcha hcaptcha，disable为禁用验证码
    CAPTCHA_TYPE: turnstile
    # captcha设置
    CAPTCHA_SITE_SECRET: 89dh29djha28dh
    CAPTCHA_SECRET_KEY: 89dh28912dh1289dh128d9d

    # Database settings 数据库配置
    # 设置了 database.url 或 database.existingSecret（即 DB_URL）时，以下 DB_* 全部忽略
    # 数据库驱动，支持sqlite postgres
    DB_DRIVER: sqlite
    DB_NAME: blog
    DB_PATH: ./data/data.db
    DB_HOST: postgres
    DB_PORT: 5432
    DB_USER: blog
    DB_PASSWORD: blog
    # postgres数据库SSL模式
    DB_SSLMODE: disable

    # Email settings 邮件配置
    EMAIL_ENABLED: false
    EMAIL_USERNAME: xxx@bbb.com
    EMAIL_PASSWORD: xxx
    EMAIL_ADDRESS: xxx@bbb.com
    EMAIL_HOST: smtp.xxx.com
    EMAIL_PORT: "465"
    EMAIL_SSL: true

    # App settings 应用程序配置
    LOG_LEVEL: info
    BASE_URL: https://blog.shenyu.moe
    MAX_REQUEST_BODY_SIZE: "1000000"
    MODE: prod

    # 后端端口，无需替换
    PORT: "80"
    PASSWORD_SALT: ""
    JWT_SECRET: ""
    TOKEN_DURATION: "3600"
    REFRESH_TOKEN_DURATION: "604800"

# 数据库连接地址（DB_URL）：设置后完全以它为准，backend.env 中的 DB_* 全部忽略；驱动由 scheme 决定
database:
  # 如 postgres://blog:password@postgres:5432/blog?sslmode=disable（也可用 postgresql://，密码中的特殊字符需 URL 编码），
  # 或 sqlite:///app/data/data.db
  url: ""
  # 从已有 Secret 读取地址（优先于 url）
  existingSecret: ""
  existingSecretKey: db-url

# Redis 共享状态：在实例间共享第三方登录 state、邮箱验证码、限流计数、AI 摘要任务状态、分布式锁与缓存失效通知；
# 前端也会用同一个 Redis 上报运行时指标，后台「系统运行」据此列出全部前后端副本
# 单副本可不配置（使用进程内存）；后端多副本（replicaCount > 1 或启用 autoscaling）时必须配置，
# 同时数据库须为 Postgres，存储须为 S3 / WebDAV 或所有副本共享的卷
redis:
  # Redis 地址，如 redis://:password@redis-master:6379/0（TLS 用 rediss://）
  url: ""
  # 从已有 Secret 读取地址（优先于 url）
  existingSecret: ""
  existingSecretKey: redis-url
  # 键前缀，多个应用共用一个 Redis 时区分
  keyPrefix: "neo-blog:"

# AI 用户：任务由每个后端实例上的 worker 在进程内执行，多副本时自动分摊（见 docs/ai-agents.md）
aiAgent:
  # 每个实例同时执行的任务数，0 表示本实例不执行
  workers: 2

## 镜像拉取密钥
imagePullSecrets: []

# 覆盖ChartName
nameOverride: ""
fullnameOverride: ""

# 服务账号
serviceAccount:
  # 是否创建
  create: true
  # 是否自动挂载
  automount: true
  # 自定义声明
  annotations: {}
  # 服务账号名
  # 若未设置将自动生成
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# 服务配置
service:
  type: ClusterIP
  # 服务端口，非必要无需更改
  port: 80

# ingress 配置
ingress:
  enabled: true
  className: "nginx"
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    frontend:
      - host: neo-blog.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    backend:
      - host: api.neo-blog.local
        paths:
          - path: /
            pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# 资源配置
resources:
  backend:
    limits:
      cpu: 2
      memory: 2Gi
    requests:
      cpu: 2
      memory: 2Gi
  frontend:
    limits:
      cpu: 64
      memory: 64Gi
    requests:
      cpu: 64
      memory: 64Gi


# 自动扩缩容
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# 存储卷
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
