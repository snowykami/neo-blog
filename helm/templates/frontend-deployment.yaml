{{- if .Values.frontend.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neo-blog.fullname" . }}-frontend
  labels:
    {{- include "neo-blog.frontend.selectorLabels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      {{- toYaml .Values.rollingUpdate | nindent 6 }}
  selector:
    matchLabels:
      {{- include "neo-blog.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "neo-blog.frontend.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "neo-blog.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-frontend
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $tag := .Values.image.frontendTag | default .Chart.AppVersion }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.frontend }}:{{ $tag }}"
          imagePullPolicy: {{ include "neo-blog.pullPolicy" (dict "root" . "tag" $tag) }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: BACKEND_URL
              value: "http://{{(include "neo-blog.fullname" .)}}-backend:{{ .Values.service.port }}"
            - name: PORT
              value: "{{ .Values.service.port }}"
            # Downward API：后台「系统运行」在实例信息里显示 Pod、命名空间与节点，只用于展示
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # 与后端共用 Redis：前端每个副本把运行时指标写进去，后台「系统运行」才能列出全部前端副本
            {{- if .Values.redis.existingSecret }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecret | quote }}
                  key: {{ .Values.redis.existingSecretKey | default "redis-url" | quote }}
            {{- else if .Values.redis.url }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
            {{- end }}
            {{- if and (or .Values.redis.existingSecret .Values.redis.url) .Values.redis.keyPrefix }}
            - name: REDIS_KEY_PREFIX
              value: {{ .Values.redis.keyPrefix | quote }}
            {{- end }}
            {{- if and .Values.telemetry .Values.telemetry.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "{{ .Chart.Name }}-frontend"
            {{- if .Values.telemetry.otlpHeaders }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: {{ .Values.telemetry.otlpHeaders | quote }}
            {{- end }}
            {{- end }}
          # 退出前先等几秒，让负载均衡摘掉本实例，再由 Next.js 处理完进行中的请求后退出
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.frontendPreStopSleepSeconds }}"]
          # 探针用 /healthz：只看 Next.js 能否响应，不依赖后端，也不做页面渲染
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          {{- with .Values.resources.frontend }}
          resources:
            {{- toYaml . | nindent 12}}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- end -}}