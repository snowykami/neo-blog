{{- include "neo-blog.validateReplicas" . }}
{{- include "neo-blog.validateSecrets" . }}
{{- $secretKeys := .Values.backend.secrets.keys | default dict }}
{{- $fromSecret := .Values.backend.secrets.existingSecret }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neo-blog.fullname" . }}-backend
  labels:
    {{- include "neo-blog.backend.selectorLabels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      {{- toYaml .Values.rollingUpdate | nindent 6 }}
  selector:
    matchLabels:
      {{- include "neo-blog.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "neo-blog.backend.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "neo-blog.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-backend
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $tag := .Values.image.backendTag | default .Chart.AppVersion }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.backend }}:{{ $tag }}"
          imagePullPolicy: {{ include "neo-blog.pullPolicy" (dict "root" . "tag" $tag) }}
          env:
            {{- range $key, $val := .Values.backend.env }}
            {{- if not (and $fromSecret (hasKey $secretKeys $key)) }}
            - name: {{ $key | quote }}
              value: {{ $val | quote }}
            {{- end }}
            {{- end }}
            {{- if $fromSecret }}
            {{- range $key, $secretKey := $secretKeys }}
            {{- $requiredInProd := and (eq (toString $.Values.backend.env.MODE) "prod") (or (eq $key "JWT_SECRET") (eq $key "PASSWORD_SALT")) (not (index $.Values.backend.env $key)) }}
            - name: {{ $key | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ $fromSecret | quote }}
                  key: {{ $secretKey | quote }}
                  optional: {{ not $requiredInProd }}
            {{- end }}
            {{- end }}
            {{- if .Values.database.existingSecret }}
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.existingSecretKey | default "db-url" | quote }}
            {{- else if .Values.database.url }}
            - name: DB_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
            {{- if .Values.redis.existingSecret }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecret | quote }}
                  key: {{ .Values.redis.existingSecretKey | default "redis-url" | quote }}
            {{- else if .Values.redis.url }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
            {{- end }}
            - name: AI_AGENT_WORKERS
              value: {{ .Values.aiAgent.workers | quote }}
            # Downward API：后台「系统运行」在实例信息里显示 Pod、命名空间与节点，只用于展示
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if and (or .Values.redis.existingSecret .Values.redis.url) .Values.redis.keyPrefix }}
            - name: REDIS_KEY_PREFIX
              value: {{ .Values.redis.keyPrefix | quote }}
            {{- end }}
            {{- if and .Values.telemetry .Values.telemetry.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "{{ .Chart.Name }}-backend"
            {{- if .Values.telemetry.otlpHeaders }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: {{ .Values.telemetry.otlpHeaders | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # 启动检查：数据库迁移完成后才开始监听，迁移期间不做存活检查，最多等 5 分钟
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 150
          # 存活检查只看进程能否响应，不依赖数据库
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # 就绪检查：数据库不可用或正在退出时摘掉本实例
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          {{- with .Values.resources.backend }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
