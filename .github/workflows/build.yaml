name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 先跑测试（test.yaml），任一项失败都不构建、不推送镜像
  test:
    uses: ./.github/workflows/test.yaml

  build-and-push-frontend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          # 同时推送提交 sha 标签：部署时固定版本，才能按版本滚动更新与回滚
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/neo-blog-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/neo-blog-frontend:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            IMAGE_OPTIMIZE_HOSTS=${{ vars.IMAGE_OPTIMIZE_HOSTS }}
          # 构建缓存存在 GitHub Actions 缓存里，依赖没变时跳过 pnpm install；前后端用不同 scope，互不覆盖
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  build-and-push-backend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 同时推送提交 sha 标签：部署时固定版本，才能按版本滚动更新与回滚
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/neo-blog-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/neo-blog-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
