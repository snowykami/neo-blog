name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          # 同时推送提交 sha 标签：部署时固定版本，才能按版本滚动更新与回滚
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/neo-blog-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/neo-blog-frontend:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            IMAGE_OPTIMIZE_HOSTS=${{ vars.IMAGE_OPTIMIZE_HOSTS }}

  build-and-push-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 同时推送提交 sha 标签：部署时固定版本，才能按版本滚动更新与回滚
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/neo-blog-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/neo-blog-backend:${{ github.sha }}
